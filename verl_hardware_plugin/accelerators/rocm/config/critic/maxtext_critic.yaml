# Present so model_engine=maxtext composes; the maxtext strategy has no value head (use GRPO).
defaults:
  - ../optim@optim: fsdp
  - ../engine@maxtext: maxtext
  - critic
  - _self_

_target_: verl_hardware_plugin.accelerators.rocm.primus.maxtext.config.MaxTextCriticConfig

strategy: maxtext

maxtext:
  primus_config_path: ${oc.select:actor_rollout_ref.actor.maxtext.primus_config_path,""}

data_loader_seed: ${oc.select:actor_rollout_ref.actor.data_loader_seed,null}
