name: Release to PyPI

# One-time setup, needs verl-project org rights (nothing here works without it):
#   1. On pypi.org add a "pending publisher" for project `verl-hardware-plugin`:
#      owner verl-project, repo verl-hardware-plugin, workflow release.yml,
#      environment pypi.
#   2. In this repo's Settings > Environments create an environment named `pypi`
#      (optionally require a reviewer to approve each release).
# No API token is stored: the publish job uses PyPI trusted publishing (OIDC).
#
# Release: bump `version` in pyproject.toml, merge, then push a tag `vX.Y.Z`
# that matches it. Run manually (workflow_dispatch) to only build and check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${pkg}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${pkg}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a pushed tag publishes. A manual run (workflow_dispatch) started on a v* tag has the same ref, so the ref
    # check alone would let it upload; the event name keeps manual runs build-only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
